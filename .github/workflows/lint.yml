name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!LICENSE'

      - if: steps.changes.outputs.src == 'true'
        name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - if: steps.changes.outputs.src == 'true'
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - if: steps.changes.outputs.src == 'true'
        name: Run detekt and check badges
        run: ./gradlew :library:detekt checkKotlinBadge

name: Binary Compatibility

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read

jobs:
  check-abi:
    name: Check Binary Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Kotlin ABI
        run: ./gradlew checkKotlinAbi

      - name: Check for Breaking API Changes vs PR Title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch origin main

          # Check if any .api files were modified in this PR
          API_CHANGED=$(git diff --name-only origin/main...HEAD | grep '\.api$' || true)

          if [ -n "$API_CHANGED" ]; then
            echo "Public API dump files were modified!"

            # Check if the PR title contains a breaking change indicator (!) 
            # e.g., "feat!:", "fix!:", or "refactor!:"
            CONVENTIONAL_BREAKING_PATTERN='^[a-zA-Z]+(\([^)]+\))?!:'
            KEYWORD_BREAKING_PATTERN='BREAKING[ -]CHANGE'

            if [[ ! "$PR_TITLE" =~ $CONVENTIONAL_BREAKING_PATTERN ]] && [[ ! "$PR_TITLE" =~ $KEYWORD_BREAKING_PATTERN ]]; then
              echo "::error::API breaking changes detected (.api files modified), but the PR title does not indicate a breaking change."
              echo "::error::Please update the PR title to use conventional commits for breaking changes (e.g., 'feat!: description')."
              exit 1
            else
              echo "Breaking change correctly declared in PR title."
            fi
          fi
